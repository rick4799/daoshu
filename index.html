/* ---------- Trunk path ---------- */
function makeTrunkPath(x,y){
  var baseHalfW=38,flareHalfW=46,topHalfW=12;
  var baseY=y+105,flareY=y+92,topY=y-120;
  return "M"+(x-flareHalfW)+","+baseY+
    "Q"+(x-baseHalfW*0.95)+","+flareY+" "+(x-baseHalfW)+","+(y+65)+
    "C"+(x-baseHalfW*1.12)+","+(y+20)+" "+(x-topHalfW*1.9)+","+(y-55)+" "+(x-topHalfW)+","+topY+
    "L"+(x+topHalfW)+","+topY+
    "C"+(x+topHalfW*1.9)+","+(y-55)+" "+(x+baseHalfW*1.12)+","+(y+20)+" "+(x+baseHalfW)+","+(y+65)+
    "Q"+(x+baseHalfW*0.95)+","+flareY+" "+(x+flareHalfW)+","+baseY+"Z";
}

/* ---------- Branch path ---------- */
function makeBranchPath(x1,y1,x2,y2,w1,w2){
  var dx=x2-x1,dy=y2-y1;
  var len=Math.sqrt(dx*dx+dy*dy);
  if(len<0.1)len=0.1;
  var px=-dy/len,py=dx/len;
  var curveOff=len*0.05;
  var mcx=(x1+x2)/2+px*curveOff,mcy=(y1+y2)/2+py*curveOff;
  var avgW=(w1+w2)/2;
  var lcx=mcx+px*avgW,lcy=mcy+py*avgW;
  var rcx=mcx-px*avgW,rcy=mcy-py*avgW;
  var lp1x=x1+px*w1,lp1y=y1+py*w1;
  var lp2x=x2+px*w2,lp2y=y2+py*w2;
  var rp1x=x1-px*w1,rp1y=y1-py*w1;
  var rp2x=x2-px*w2,rp2y=y2-py*w2;
  return "M"+lp1x+","+lp1y+"Q"+lcx+","+lcy+" "+lp2x+","+lp2y+"L"+rp2x+","+rp2y+"Q"+rcx+","+rcy+" "+rp1x+","+rp1y+"Z";
}
function getBranchWidths(parentNode,childNode){
  if(parentNode.type==="trunk")return{w1:9,w2:5};
  var pd=getBranchDepth(parentNode);
  if(pd<=1)return{w1:5,w2:3};
  return{w1:3,w2:1.5};
}

/* ---------- Simulation ---------- */
function simulate(){
  var nodes=state.nodes;
  if(nodes.length===0){requestAnimationFrame(simulate);return;}
  var W=canvasArea.clientWidth,H=canvasArea.clientHeight,cx=W/2,cy=H/2;
  for(var i=0;i<nodes.length;i++){nodes[i].fx=0;nodes[i].fy=0;}
  var repK=7000;
  for(var a=0;a<nodes.length;a++){
    if(!isNodeVisible(nodes[a].id))continue;
    for(var b=a+1;b<nodes.length;b++){
    if(!isNodeVisible(nodes[b].id))continue;
    var na=nodes[a],nb=nodes[b];
    var dx=na.x-nb.x,dy=na.y-nb.y,d2=dx*dx+dy*dy;
    if(d2<1){d2=1;dx=(Math.random()-0.5)*2;dy=(Math.random()-0.5)*2;}
    var d=Math.sqrt(d2),f=repK/d2,fxv=(dx/d)*f,fyv=(dy/d)*f;
    na.fx+=fxv;na.fy+=fyv;nb.fx-=fxv;nb.fy-=fyv;
  }}
  var linkLen=125,springK=0.04;
  for(var s=0;s<nodes.length;s++){
    var n=nodes[s];if(!n.parentId)continue;
    if(!isNodeVisible(n.id))continue;
    var p=getNode(n.parentId);if(!p)continue;
    var sdx=n.x-p.x,sdy=n.y-p.y,sd=Math.sqrt(sdx*sdx+sdy*sdy);
    if(sd<1)sd=1;var sf=(sd-linkLen)*springK,sfx=(sdx/sd)*sf,sfy=(sdy/sd)*sf;
    n.fx-=sfx;n.fy-=sfy;p.fx+=sfx;p.fy+=sfy;
  }
  for(var c=0;c<nodes.length;c++){
    var cn=nodes[c];
    if(!isNodeVisible(cn.id))continue;
    if(cn.type==="trunk"){cn.fx+=(cx-cn.x)*0.06;cn.fy+=(cy-cn.y)*0.06;}
    else{cn.fx+=(cx-cn.x)*0.003;cn.fy+=(cy-cn.y)*0.003;}
  }
  simAlpha=Math.max(simAlpha*0.998,0.02);
  if(growthAnim>0)growthAnim=Math.max(growthAnim-0.02,0);
  for(var u=0;u<nodes.length;u++){
    var un=nodes[u];
    if(!isNodeVisible(un.id))continue;
    if(drag&&drag.id===un.id)continue;
    if(un.type==="trunk"){un.x+=un.fx*0.15;un.y+=un.fy*0.15;}
    else{un.vx=(un.vx+un.fx*0.5)*0.82;un.vy=(un.vy+un.fy*0.5)*0.82;un.x+=un.vx*simAlpha;un.y+=un.vy*simAlpha;}
    var margin=(getNodeStyle(un).radius||16)+8;
    if(un.x<margin)un.x=margin;if(un.x>W-margin)un.x=W-margin;
    if(un.y<margin)un.y=margin;if(un.y>H-margin)un.y=H-margin;
  }
  render();
  renderParticles();
  requestAnimationFrame(simulate);
}

/* ---------- Render Associations ---------- */
function shouldShowAssoc(srcId,tgtId){
  if(state.showAllAssoc)return true;
  if(state.selectedId===srcId||state.selectedId===tgtId)return true;
  return false;
}
function renderAssociations(t){
  var needRecreate=lastAssocRenderVersion!==state.assocVersion||
    lastShowAllAssoc!==state.showAllAssoc||
    lastSelectedForAssoc!==state.selectedId;
  if(needRecreate){
    lastAssocRenderVersion=state.assocVersion;
    lastShowAllAssoc=state.showAllAssoc;
    lastSelectedForAssoc=state.selectedId;
    while(assocsGroup.firstChild)assocsGroup.removeChild(assocsGroup.firstChild);
    var drawn={};
    for(var i=0;i<state.nodes.length;i++){
      var n=state.nodes[i];
      if(!n.associations||n.associations.length===0)continue;
      for(var j=0;j<n.associations.length;j++){
        var assoc=n.associations[j];
        var target=getNode(assoc.targetId);
        if(!target)continue;
        if(!shouldShowAssoc(n.id,target.id))continue;
        var key=n.id<target.id?n.id+"|"+target.id:target.id+"|"+n.id;
        if(drawn[key])continue;drawn[key]=true;
        var line=createEl("line");
        line.setAttribute("x1",n.x);line.setAttribute("y1",n.y);
        line.setAttribute("x2",target.x);line.setAttribute("y2",target.y);
        line.setAttribute("class","assoc-line");
        line.setAttribute("stroke","rgba(220,230,255,0.5)");
        line.setAttribute("stroke-width","1.5");
        line.setAttribute("stroke-dasharray","6 4");
        line.setAttribute("stroke-linecap","round");
        line.setAttribute("pointer-events","stroke");
        line.setAttribute("data-source",n.id);
        line.setAttribute("data-target",assoc.targetId);
        line.setAttribute("data-label",assoc.label);
        (function(el,srcId,tgtId,label){
          el.addEventListener("mouseenter",function(e){
            hoveringAssocLine=true;
            el.setAttribute("stroke","rgba(220,230,255,1.0)");
            el.setAttribute("stroke-width","2");
            tooltip.style.display="block";
            tooltip.innerHTML='<div class="tt-assoc"> '+escapeHtml(label)+"</div>";
            tooltip.style.left=(e.clientX+16)+"px";
            tooltip.style.top=(e.clientY+16)+"px";
          });
          el.addEventListener("mouseleave",function(){
            hoveringAssocLine=false;
            el.setAttribute("stroke","rgba(220,230,255,0.5)");
            el.setAttribute("stroke-width","1.5");
            tooltip.style.display="none";
          });
          el.addEventListener("mousemove",function(e){
            tooltip.style.left=(e.clientX+16)+"px";
            tooltip.style.top=(e.clientY+16)+"px";
          });
          el.addEventListener("click",function(e){
            e.stopPropagation();
            showLineMenu(e.clientX,e.clientY,srcId,tgtId,label);
          });
        })(line,n.id,assoc.targetId,assoc.label);
        assocsGroup.appendChild(line);
      }
    }
  }else{
    for(var li=0;li<assocsGroup.children.length;li++){
      var el=assocsGroup.children[li];
      var src=getNode(el.getAttribute("data-source"));
      var tgt=getNode(el.getAttribute("data-target"));
      if(src&&tgt){
        el.setAttribute("x1",src.x);el.setAttribute("y1",src.y);
        el.setAttribute("x2",tgt.x);el.setAttribute("y2",tgt.y);
      }
    }
  }
}

/* ---------- Render ---------- */
function render(){
  var t=Date.now()/1000;
  renderAssociations(t);
  while(linksGroup.firstChild)linksGroup.removeChild(linksGroup.firstChild);
  while(nodesGroup.firstChild)nodesGroup.removeChild(nodesGroup.firstChild);

  var trunkNode=getTrunk();
  if(trunkNode){
    var tp=makeTrunkPath(trunkNode.x,trunkNode.y);
    var tGlow=createEl("path");
    tGlow.setAttribute("d",tp);tGlow.setAttribute("fill","#e8d5a0");
    var tBr=0.04+Math.sin(t/5*Math.PI*2)*0.03;
    tGlow.setAttribute("opacity",tBr);tGlow.setAttribute("filter","url(#glow-strong)");
    tGlow.setAttribute("pointer-events","none");linksGroup.appendChild(tGlow);
    var tBody=createEl("path");
    tBody.setAttribute("d",tp);tBody.setAttribute("fill","url(#trunk-grad)");
    tBody.setAttribute("opacity","0.75");tBody.setAttribute("pointer-events","none");
    linksGroup.appendChild(tBody);
    var tLine=createEl("path");
    tLine.setAttribute("d",tp);tLine.setAttribute("fill","none");
    tLine.setAttribute("stroke","#e8d5a0");tLine.setAttribute("stroke-width","1");
    tLine.setAttribute("opacity","0.35");tLine.setAttribute("pointer-events","none");
    linksGroup.appendChild(tLine);
  }

  for(var li=0;li<state.nodes.length;li++){
    var ln=state.nodes[li];
    if(!ln.parentId)continue;
    if(!isNodeVisible(ln.id))continue;
    var lp=getNode(ln.parentId);if(!lp)continue;
    var widths=getBranchWidths(lp,ln);
    var childStyle=getNodeStyle(ln);
    var bEndX=ln.x,bEndY=ln.y;
    if(growthAnim>0&&ln.type!=="trunk"){
      var gp=1-growthAnim;
      var ge=1-Math.pow(1-gp,3);
      bEndX=lp.x+(ln.x-lp.x)*ge;
      bEndY=lp.y+(ln.y-lp.y)*ge;
    }
    var bd=makeBranchPath(lp.x,lp.y,bEndX,bEndY,widths.w1,widths.w2);
    var bGlow=createEl("path");
    bGlow.setAttribute("d",bd);bGlow.setAttribute("fill",childStyle.glow);
    bGlow.setAttribute("opacity","0.06");bGlow.setAttribute("filter","url(#glow-soft)");
    bGlow.setAttribute("pointer-events","none");linksGroup.appendChild(bGlow);
    var bFill=createEl("path");
    bFill.setAttribute("d",bd);bFill.setAttribute("fill",childStyle.stroke);
    bFill.setAttribute("opacity","0.28");bFill.setAttribute("pointer-events","none");
    linksGroup.appendChild(bFill);
    var bStroke=createEl("path");
    bStroke.setAttribute("d",bd);bStroke.setAttribute("fill","none");
    bStroke.setAttribute("stroke",childStyle.stroke);bStroke.setAttribute("stroke-width","0.8");
    bStroke.setAttribute("opacity","0.4");bStroke.setAttribute("pointer-events","none");
    linksGroup.appendChild(bStroke);
  }

  var flashElapsed=state.flashingNode?Date.now()-state.flashStart:999;
  if(flashElapsed>800)state.flashingNode=null;
  var flashIntensity=state.flashingNode?Math.sin((flashElapsed/800)*Math.PI):0;

  for(var ni=0;ni<state.nodes.length;ni++){
    var n=state.nodes[ni];
    if(!isNodeVisible(n.id))continue;
    var st=getNodeStyle(n);
    var selected=n.id===state.selectedId;
    var isAssocSrc=state.assocMode&&state.assocStart===n.id;
    var isDropTarget=dragTransferTarget===n.id&&drag&&(drag.type==="branch"||drag.type==="leaf")&&(n.type==="branch"||n.type==="trunk")&&drag.id!==n.id;
    var phase=hashId(n.id)*Math.PI*2;
    var breath=(Math.sin((t/st.breathPeriod)*Math.PI*2+phase)+1)/2;

    var ss={fillOp:0.1,strokeOp:0.6,glowMult:1,breathMult:1,textOp:0.85};
    if(n.type==="leaf"&&n.leafData){
      var tmp=LEAF_STATUS_STYLE[n.leafData.status];
      if(tmp)ss=tmp;
    }
    if(n.type==="leaf"&&n.marked){
      st={radius:st.radius,fill:MARKED_LEAF_STYLE.fill,stroke:MARKED_LEAF_STYLE.stroke,glow:MARKED_LEAF_STYLE.glow,text:MARKED_LEAF_STYLE.text,fontSize:st.fontSize,breathBase:st.breathBase,breathAmp:st.breathAmp,breathPeriod:st.breathPeriod};
      ss={fillOp:0.45,strokeOp:0.95,glowMult:2.2,breathMult:1.8,textOp:1.0};
    }

    if(isAssocSrc){
      st={radius:st.radius,fill:"rgba(180,140,220,0.12)",stroke:"#b48cd8",glow:"#b48cd8",text:"#c8a0e0",fontSize:st.fontSize,breathBase:st.breathBase,breathAmp:st.breathAmp,breathPeriod:st.breathPeriod};
    }

    var g=createEl("g");
    g.setAttribute("class","node-group"+(isDropTarget?" branch-drop-target":""));
    var renderX=n.x,renderY=n.y,renderScale=1;
    if(growthAnim>0&&n.type!=="trunk"){
      var progress=1-growthAnim;
      var eased=1-Math.pow(1-progress,3);
      renderScale=Math.max(0.05,eased);
      var parent=getNode(n.parentId);
      if(parent){
        renderX=parent.x+(n.x-parent.x)*eased;
        renderY=parent.y+(n.y-parent.y)*eased;
      }
    }
    g.setAttribute("transform","translate("+renderX+","+renderY+") scale("+renderScale+")");
    g.setAttribute("data-id",n.id);
    g.setAttribute("data-type",n.type);

    if(n.type==="leaf"){
      var breathVal=breath*ss.breathMult;
      var flashGlow=state.flashingNode===n.id?flashIntensity*0.3:0;
      var lGlow=createEl("path");
      lGlow.setAttribute("d",LEAF_PATH);lGlow.setAttribute("fill",st.glow);
      lGlow.setAttribute("opacity",(st.breathBase+breathVal*st.breathAmp)*ss.glowMult*3+flashGlow);
      lGlow.setAttribute("filter","url(#glow-leaf)");lGlow.setAttribute("pointer-events","none");
      g.appendChild(lGlow);
      if(selected){
        var lRing=createEl("circle");
        lRing.setAttribute("r",st.radius+5);lRing.setAttribute("fill","none");
        lRing.setAttribute("stroke",st.stroke);lRing.setAttribute("stroke-width","1");
        lRing.setAttribute("opacity","0.35");lRing.setAttribute("stroke-dasharray","3 3");
        lRing.setAttribute("pointer-events","none");g.appendChild(lRing);
      }
      var lBody=createEl("path");
      lBody.setAttribute("d",LEAF_PATH);lBody.setAttribute("fill",st.fill);
      lBody.setAttribute("fill-opacity",ss.fillOp);lBody.setAttribute("stroke",st.stroke);
      lBody.setAttribute("stroke-width",selected?"1.5":"1.2");
      lBody.setAttribute("stroke-opacity",ss.strokeOp);
      g.appendChild(lBody);
      var lVein=createEl("path");
      lVein.setAttribute("d",LEAF_VEIN);lVein.setAttribute("stroke",st.stroke);
      lVein.setAttribute("stroke-width","0.6");lVein.setAttribute("opacity",ss.strokeOp*0.5);
      lVein.setAttribute("fill","none");lVein.setAttribute("pointer-events","none");
      g.appendChild(lVein);
      /* Content type icon */
      if(n.contentType){
        var ctColor=CONTENT_TYPE_COLORS[n.contentType]||"#888";
        var ctDot=createEl("circle");
        ctDot.setAttribute("r","3.5");ctDot.setAttribute("fill",ctColor);
        ctDot.setAttribute("opacity",ss.textOp*0.7);
        ctDot.setAttribute("cx","10");ctDot.setAttribute("cy","-6");
        ctDot.setAttribute("pointer-events","none");
        g.appendChild(ctDot);
      }
      var dotColor={"待实践":"#555","已实践":"#4dd0e1","已内化":"#a5d6a7"};
      var lDot=createEl("circle");
      lDot.setAttribute("r","2.5");
      lDot.setAttribute("fill",dotColor[n.leafData?n.leafData.status:"待实践"]||"#555");
      lDot.setAttribute("opacity",ss.textOp*0.8);
      lDot.setAttribute("cy","8");
      lDot.setAttribute("pointer-events","none");
      g.appendChild(lDot);
      var lText=createEl("text");
      lText.setAttribute("text-anchor","middle");lText.setAttribute("dominant-baseline","central");
      lText.setAttribute("fill",st.text);lText.setAttribute("font-size",st.fontSize);
      lText.setAttribute("font-weight","600");lText.setAttribute("font-family","sans-serif");
      lText.setAttribute("pointer-events","none");lText.setAttribute("opacity",ss.textOp);
      var lLabel=n.title||"";
      if(lLabel.length>2)lLabel=lLabel.slice(0,2)+"…";
      lText.textContent=lLabel;
      g.appendChild(lText);
    }else{
      var flashGlow2=state.flashingNode===n.id?flashIntensity*0.15:0;
      var glowConfigs=n.type==="trunk"?[
        {r:2.2,opacity:0.06+flashGlow2,filter:"glow-strong"},
        {r:1.4,opacity:0.09+flashGlow2,filter:"glow-medium"},
      ]:[
        {r:2.0,opacity:0.05+flashGlow2,filter:"glow-medium"},
        {r:1.3,opacity:0.08+flashGlow2,filter:"glow-soft"},
      ];
      for(var gi=0;gi<glowConfigs.length;gi++){
        var layer=glowConfigs[gi];
        var glowC=createEl("circle");
        glowC.setAttribute("r",st.radius*layer.r);glowC.setAttribute("fill",st.glow);
        var lop=(st.breathBase+breath*st.breathAmp)*layer.opacity*7;
        glowC.setAttribute("opacity",Math.min(lop,0.4));
        glowC.setAttribute("filter","url(#"+layer.filter+")");
        glowC.setAttribute("pointer-events","none");g.appendChild(glowC);
      }
      if(selected){
        var ring=createEl("circle");
        ring.setAttribute("r",st.radius+6);ring.setAttribute("fill","none");
        ring.setAttribute("stroke",st.stroke);ring.setAttribute("stroke-width","1");
        ring.setAttribute("opacity","0.4");ring.setAttribute("stroke-dasharray","4 4");
        ring.setAttribute("pointer-events","none");g.appendChild(ring);
      }
      var circle=createEl("circle");
      circle.setAttribute("r",st.radius);circle.setAttribute("fill",st.fill);
      circle.setAttribute("stroke",st.stroke);
      circle.setAttribute("stroke-width",selected?"2":"1.2");
      circle.setAttribute("opacity","0.85");
      g.appendChild(circle);
      var text=createEl("text");
      text.setAttribute("text-anchor","middle");text.setAttribute("dominant-baseline","central");
      text.setAttribute("fill",st.text);text.setAttribute("font-size",st.fontSize);
      text.setAttribute("font-weight","bold");text.setAttribute("font-family","sans-serif");
      text.setAttribute("pointer-events","none");text.setAttribute("opacity","0.9");
      var label=n.title||"";
      var maxLen=n.type==="trunk"?4:5;
      if(label.length>maxLen)label=label.slice(0,maxLen)+"…";
      text.textContent=label;
      g.appendChild(text);
      if(n.collapsed){
        var childCount=getChildren(n.id).length;
        if(childCount>0){
          var collapseBadge=createEl("circle");
          collapseBadge.setAttribute("r","7");
          collapseBadge.setAttribute("cx",st.radius-2);
          collapseBadge.setAttribute("cy",-(st.radius-4));
          collapseBadge.setAttribute("fill","rgba(20,50,70,0.9)");
          collapseBadge.setAttribute("stroke",st.stroke);
          collapseBadge.setAttribute("stroke-width","1");
          collapseBadge.setAttribute("opacity","0.85");
          collapseBadge.setAttribute("pointer-events","none");
          g.appendChild(collapseBadge);
          var collapseText=createEl("text");
          collapseText.setAttribute("text-anchor","middle");
          collapseText.setAttribute("dominant-baseline","central");
          collapseText.setAttribute("x",st.radius-2);
          collapseText.setAttribute("y",-(st.radius-4));
          collapseText.setAttribute("fill",st.text);
          collapseText.setAttribute("font-size","9");
          collapseText.setAttribute("font-weight","bold");
          collapseText.setAttribute("font-family","sans-serif");
          collapseText.setAttribute("pointer-events","none");
          collapseText.textContent="+"+childCount;
          g.appendChild(collapseText);
        }
      }
    }
    nodesGroup.appendChild(g);
  }
}

/* ---------- Detail Panel Renderers ---------- */
function updateDetailPanel(){
  var node=state.selectedId?getNode(state.selectedId):null;
  if(!node){
    detailEmpty.style.display="flex";detailContent.style.display="none";
    btnAddLeaf.disabled=true;return;
  }
  detailEmpty.style.display="none";detailContent.style.display="flex";
  var detailScroll=document.getElementById("detail-scroll");
  if(detailScroll){
    if(node.type==="leaf")detailScroll.classList.add("leaf-bg");
    else detailScroll.classList.remove("leaf-bg");
  }
  detailType.textContent=TYPE_LABELS[node.type];
  detailType.className="detail-type-tag "+node.type;
  detailTitle.value=node.title||"";

  contentFieldsEl.innerHTML="";

  if(node.type==="leaf"){
    /* Content type selector */
    var ctRow=document.createElement("div");
    ctRow.className="content-type-row";
    var ctLabel=document.createElement("div");
    ctLabel.className="content-type-label";
    ctLabel.textContent="内容类型";
    var ctSelect=document.createElement("select");
    ctSelect.className="content-type-select";
    for(var ci=0;ci<CONTENT_TYPES.length;ci++){
      var opt=document.createElement("option");
      opt.value=CONTENT_TYPES[ci];opt.textContent=CONTENT_TYPE_LABELS[CONTENT_TYPES[ci]];
      if(node.contentType===CONTENT_TYPES[ci])opt.selected=true;
      ctSelect.appendChild(opt);
    }
    ctSelect.addEventListener("change",function(){
      node.contentType=ctSelect.value;saveState();updateDetailPanel();state.assocVersion++;
    });
    ctRow.appendChild(ctLabel);ctRow.appendChild(ctSelect);
    contentFieldsEl.appendChild(ctRow);

    if(node.contentType==="rich-text"){
      renderRichTextEditor(node);
    }else if(node.contentType==="mindmap"){
      renderMindmapEditor(node);
    }else if(node.contentType==="table"){
      renderTableEditor(node);
    }else if(node.contentType==="gallery"){
      renderGalleryEditor(node);
    }
  }else{
    /* Non-leaf content */
    var field=document.createElement("div");
    field.className="rt-field";
    var header=document.createElement("div");
    header.className="rt-field-header";
    var label=document.createElement("div");
    label.className="rt-field-label";label.textContent="内容";
    header.appendChild(label);
    field.appendChild(header);
    var ta=document.createElement("textarea");
    ta.className="rt-textarea";ta.placeholder="详细内容...";
    ta.value=node.content||"";
    ta.style.minHeight="120px";
    ta.addEventListener("input",function(){node.content=ta.value;saveState();});
    field.appendChild(ta);
    contentFieldsEl.appendChild(field);
  }

  /* Association section */
  updateAssocSection(node);

  /* Footer buttons */
  if(node.type==="trunk"){
    detailAddBtn.style.display="";
    detailAddSubBtn.style.display="none";
    detailAddLeafBtn.style.display="none";
    detailAddBtn.textContent="添加支干";
    btnAddLeaf.disabled=true;
    detailDeleteBtn.style.display="none";
  }else if(node.type==="branch"){
    detailAddBtn.style.display="none";
    detailAddSubBtn.style.display="";
    detailAddLeafBtn.style.display="";
    btnAddLeaf.disabled=false;
    detailDeleteBtn.style.display="";
  }else{
    detailAddBtn.style.display="none";
    detailAddSubBtn.style.display="none";
    detailAddLeafBtn.style.display="none";
    btnAddLeaf.disabled=true;
    detailDeleteBtn.style.display="";
  }
}

function updateAssocSection(node){
  node=node||(state.selectedId?getNode(state.selectedId):null);
  if(!node){assocSection.style.display="none";return;}
  var allAssoc=getAllAssociations(node.id);
  if(allAssoc.length===0){assocSection.style.display="none";return;}
  assocSection.style.display="";
  assocList.innerHTML="";
  for(var i=0;i<allAssoc.length;i++){
    var a=allAssoc[i];
    var otherId=a.direction==="out"?a.targetId:a.sourceId;
    var otherNode=getNode(otherId);
    if(!otherNode)continue;
    var item=document.createElement("div");
    item.className="assoc-item";
    var arrow=document.createElement("span");
    arrow.className="assoc-arrow";
    arrow.textContent=a.direction==="out"?"→":"←";
    var title=document.createElement("span");
    title.className="assoc-title";
    title.textContent=otherNode.title||"未命名";
    var label=document.createElement("span");
    label.className="assoc-label";
    label.textContent=a.label;
    item.appendChild(arrow);item.appendChild(title);item.appendChild(label);
    (function(tid){item.addEventListener("click",function(){navigateToNode(tid);});})(otherId);
    assocList.appendChild(item);
  }
}

function getAllAssociations(nodeId){
  var result=[];
  var node=getNode(nodeId);
  if(node&&node.associations){
    for(var i=0;i<node.associations.length;i++){
      result.push({direction:"out",targetId:node.associations[i].targetId,label:node.associations[i].label});
    }
  }
  for(var j=0;j<state.nodes.length;j++){
    var n=state.nodes[j];
    if(n.associations){
      for(var k=0;k<n.associations.length;k++){
        if(n.associations[k].targetId===nodeId){
          result.push({direction:"in",sourceId:n.id,label:n.associations[k].label});
        }
      }
    }
  }
  return result;
}

/* ---------- Rich Text Editor ---------- */
var RICH_FIELDS=[
  {key:"contentHtml",label:"内容",placeholder:"在此输入内容...支持文字和直接粘贴图片",isContentField:true},
  {key:"questionText",label:"问题",placeholder:"待思考的问题..."},
  {key:"insightText",label:"领悟",placeholder:"从中领悟到什么..."},
  {key:"applicationText",label:"应用",placeholder:"如何应用..."},
  {key:"notesText",label:"备注",placeholder:"补充说明..."},
];
function renderRichTextEditor(node){
  /* Status row */
  var statusRow=document.createElement("div");
  statusRow.className="rt-status-row";
  var sl=document.createElement("div");
  sl.className="rt-status-label";sl.textContent="状态";
  var ss=document.createElement("select");
  ss.className="rt-status-select";
  ["待实践","已实践","已内化"].forEach(function(s){
    var o=document.createElement("option");o.value=s;o.textContent=s;
    if(node.leafData.status===s)o.selected=true;
    ss.appendChild(o);
  });
  ss.addEventListener("change",function(){
    node.leafData.status=ss.value;saveState();state.assocVersion++;
    if(ss.value==="已内化"){internalizeLeaf(node);}
  });
  statusRow.appendChild(sl);statusRow.appendChild(ss);
  contentFieldsEl.appendChild(statusRow);

  /* Preview toggle */
  var pt=document.createElement("div");
  pt.className="preview-toggle";
  var btnEdit=document.createElement("button");
  btnEdit.textContent="编辑";btnEdit.className=!previewMode?"active":"";
  var btnPrev=document.createElement("button");
  btnPrev.textContent="预览";btnPrev.className=previewMode?"active":"";
  btnEdit.addEventListener("click",function(){previewMode=false;updateDetailPanel();});
  btnPrev.addEventListener("click",function(){previewMode=true;updateDetailPanel();});
  pt.appendChild(btnEdit);pt.appendChild(btnPrev);
  contentFieldsEl.appendChild(pt);

  /* Fields */
  for(var fi=0;fi<RICH_FIELDS.length;fi++){
    (function(f){
      var field=document.createElement("div");
      field.className="rt-field";
      var fieldKey=node.id+"_"+f.key;
      var isCollapsed=fieldCollapsed[fieldKey]||false;
      var header=document.createElement("div");
      header.className="rt-field-header";
      var toggleBtn=document.createElement("button");
      toggleBtn.className="rt-field-toggle";
      toggleBtn.textContent=isCollapsed?"+":"−";
      toggleBtn.title="展开/收起";
      toggleBtn.addEventListener("mousedown",function(e){e.preventDefault();});
      toggleBtn.addEventListener("click",function(){
        fieldCollapsed[fieldKey]=!fieldCollapsed[fieldKey];
        updateDetailPanel();
      });
      header.appendChild(toggleBtn);
      var label=document.createElement("div");
      label.className="rt-field-label";label.textContent=f.label;
      header.appendChild(label);

      if(!previewMode&&!isCollapsed){
        var toolbar=document.createElement("div");
        toolbar.className="rt-toolbar";
        var btns=[
          {icon:"B",title:"加粗",action:"bold"},
          {icon:"I",title:"斜体",action:"italic"},
          {icon:"1.",title:"有序列表",action:"ol"},
          {icon:"❝",title:"引用",action:"quote"},
          {icon:"▣",title:"高亮",action:"highlight"},
        ];
        btns.forEach(function(b){
          var btn=document.createElement("button");
          btn.textContent=b.icon;btn.title=b.title;
          btn.addEventListener("mousedown",function(e){e.preventDefault();});
          btn.addEventListener("click",function(){
            var ta=field.querySelector(".rt-textarea");
            if(!ta)return;
            var start=ta.selectionStart,end=ta.selectionEnd;
            var val=ta.value,selected=val.substring(start,end)||"";
            var before=val.substring(0,start);
            var after=val.substring(end);
            if(b.action==="bold"){
              if(selected){
                ta.value=before+"【"+selected+"】"+after;
                ta.selectionStart=start+1;ta.selectionEnd=start+1+selected.length;
              }else{
                ta.value=before+"【】"+after;
                ta.selectionStart=ta.selectionEnd=start+1;
              }
            }else if(b.action==="italic"){
              if(selected){
                ta.value=before+"〈"+selected+"〉"+after;
                ta.selectionStart=start+1;ta.selectionEnd=start+1+selected.length;
              }else{
                ta.value=before+"〈〉"+after;
                ta.selectionStart=ta.selectionEnd=start+1;
              }
            }else if(b.action==="ol"){
              var lineStart=before.lastIndexOf("\n")+1;
              var lineContent=val.substring(lineStart,end);
              var allLines=lineContent.split("\n");
              var numbered=allLines.map(function(ln,idx){return(idx+1)+". "+ln;}).join("\n");
              ta.value=val.substring(0,lineStart)+numbered+after;
              ta.selectionStart=lineStart;ta.selectionEnd=lineStart+numbered.length;
            }else if(b.action==="quote"){
              var qs=before.lastIndexOf("\n")+1;
              var qc=val.substring(qs,end);
              var quoted=qc.split("\n").map(function(ln){return"「"+ln+"」";}).join("\n");
              ta.value=val.substring(0,qs)+quoted+after;
              ta.selectionStart=qs;ta.selectionEnd=qs+quoted.length;
            }else if(b.action==="highlight"){
              if(selected){
                ta.value=before+"〈〈"+selected+"〉〉"+after;
                ta.selectionStart=start+2;ta.selectionEnd=start+2+selected.length;
              }else{
                ta.value=before+"〈〈〉〉"+after;
                ta.selectionStart=ta.selectionEnd=start+2;
              }
            }
            ta.focus();
            node.leafData[f.key]=ta.value;saveState();
          });
          toolbar.appendChild(btn);
        });
        var imgBtn=document.createElement("button");
        imgBtn.textContent="🖼";imgBtn.title="插入图片";
        imgBtn.addEventListener("mousedown",function(e){e.preventDefault();});
        imgBtn.addEventListener("click",function(){
          var input=document.createElement("input");
          input.type="file";input.accept="image/*";
          input.addEventListener("change",function(){
            var file=input.files[0];if(!file)return;
            compressImage(file,function(dataUrl){
              var ta=field.querySelector(".rt-textarea");
              var md="![]("+dataUrl+")";
              var start=ta.selectionStart;
              ta.value=ta.value.substring(0,start)+md+ta.value.substring(ta.selectionEnd);
              ta.selectionStart=ta.selectionEnd=start+md.length;
              ta.focus();
              node.leafData[f.key]=ta.value;saveState();
            });
          });
          input.click();
        });
        toolbar.appendChild(imgBtn);
        header.appendChild(toolbar);
      }
      /* Content field gets a "view details" button */
      if(f.isContentField&&!previewMode){
        var viewBtn=document.createElement("button");
        viewBtn.className="content-field-view-btn";viewBtn.textContent="查看详情";
        viewBtn.addEventListener("mousedown",function(e){e.preventDefault();});
        viewBtn.addEventListener("click",function(){
          openContentViewer(node,f);
        });
        header.appendChild(viewBtn);
      }
      field.appendChild(header);

      if(!isCollapsed){
      if(f.isContentField){
        /* Content field uses contentEditable for rich editing + image paste */
        if(previewMode){
          var cPrev=document.createElement("div");
          cPrev.className="rt-preview";
          cPrev.innerHTML=node.leafData[f.key]||"<em style='color:rgba(100,130,170,0.3)'>"+f.placeholder+"</em>";
          var cImgs=cPrev.querySelectorAll("img");
          for(var ci=0;ci<cImgs.length;ci++){
            (function(img){img.addEventListener("click",function(){showLightbox(img.src);});})(cImgs[ci]);
          }
          field.appendChild(cPrev);
        }else{
          var cEdit=document.createElement("div");
          cEdit.className="content-field-editor";
          cEdit.contentEditable="true";
          cEdit.innerHTML=node.leafData[f.key]||"";
          /* Handle paste events for images */
          cEdit.addEventListener("paste",function(ev){
            handleContentPaste(ev,cEdit,node,f);
          });
          /* Auto-save on input */
          var cSaveTimer=null;
          cEdit.addEventListener("input",function(){
            if(cSaveTimer)clearTimeout(cSaveTimer);
            cSaveTimer=setTimeout(function(){
              node.leafData[f.key]=cEdit.innerHTML;saveState();
            },500);
          });
          field.appendChild(cEdit);
        }
      }else if(previewMode){
        var prev=document.createElement("div");
        prev.className="rt-preview";
        prev.innerHTML=parseMarkdown(node.leafData[f.key]||f.placeholder);
        /* Image click to lightbox */
        var imgs=prev.querySelectorAll("img");
        for(var ii=0;ii<imgs.length;ii++){
          (function(img){img.addEventListener("click",function(){showLightbox(img.src);});})(imgs[ii]);
        }
        field.appendChild(prev);
      }else{
        var ta=document.createElement("textarea");
        ta.className="rt-textarea";ta.placeholder=f.placeholder;
        ta.value=node.leafData[f.key]||"";
        var fKey=node.id+"_"+f.key;
        if(fieldHeights[fKey])ta.style.height=fieldHeights[fKey]+"px";
        ta.addEventListener("input",function(){node.leafData[f.key]=ta.value;saveState();});
        ta.addEventListener("mouseup",function(){fieldHeights[fKey]=ta.offsetHeight;});
        field.appendChild(ta);
      }
      }
      contentFieldsEl.appendChild(field);
    })(RICH_FIELDS[fi]);
  }

  /* Source section */
  var srcSection=document.createElement("div");
  srcSection.className="source-section";
  var srcCollapsed=fieldCollapsed[node.id+"_source"]||false;
  var srcHeader=document.createElement("div");
  srcHeader.className="rt-field-header";
  var srcToggle=document.createElement("button");
  srcToggle.className="rt-field-toggle";
  srcToggle.textContent=srcCollapsed?"+":"−";
  srcToggle.addEventListener("mousedown",function(e){e.preventDefault();});
  srcToggle.addEventListener("click",function(){
    fieldCollapsed[node.id+"_source"]=!fieldCollapsed[node.id+"_source"];
    updateDetailPanel();
  });
  srcHeader.appendChild(srcToggle);
  var srcLabel=document.createElement("div");
  srcLabel.className="rt-field-label";srcLabel.textContent="来源";
  srcHeader.appendChild(srcLabel);
  srcSection.appendChild(srcHeader);

  if(!previewMode&&!srcCollapsed){
    var srcTa=document.createElement("textarea");
    srcTa.className="rt-textarea";srcTa.placeholder="来源信息、引用出处...";
    srcTa.style.minHeight="60px";
    srcTa.value=node.leafData.sourceText||"";
    srcTa.addEventListener("input",function(){node.leafData.sourceText=srcTa.value;saveState();});
    srcSection.appendChild(srcTa);

    var srcImgsDiv=document.createElement("div");
    srcImgsDiv.className="source-images";
    (node.leafData.sourceImages||[]).forEach(function(imgData,idx){
      var item=document.createElement("div");
      item.className="source-img-item";
      var img=document.createElement("img");img.src=imgData;
      var rm=document.createElement("button");
      rm.className="remove-src";rm.textContent="×";
      rm.addEventListener("click",function(){
        node.leafData.sourceImages.splice(idx,1);saveState();updateDetailPanel();
      });
      item.appendChild(img);item.appendChild(rm);
      item.addEventListener("click",function(){showLightbox(imgData);});
      srcImgsDiv.appendChild(item);
    });
    var addBtn=document.createElement("div");
    addBtn.className="source-img-item";
    addBtn.style.cursor="pointer";
    addBtn.style.background="rgba(12,20,38,0.5)";
    addBtn.style.display="flex";
    addBtn.style.alignItems="center";
    addBtn.style.justifyContent="center";
    addBtn.innerHTML='<span style="position:absolute;font-size:24px;color:rgba(100,140,180,0.4);">+</span>';
    addBtn.addEventListener("click",function(){
      var input=document.createElement("input");
      input.type="file";input.accept="image/*";
      input.addEventListener("change",function(){
        var file=input.files[0];if(!file)return;
        compressImage(file,function(dataUrl){
          if(!node.leafData.sourceImages)node.leafData.sourceImages=[];
          node.leafData.sourceImages.push(dataUrl);
          saveState();updateDetailPanel();
        });
      });
      input.click();
    });
    srcImgsDiv.appendChild(addBtn);
    srcSection.appendChild(srcImgsDiv);
  }else{
    if(node.leafData.sourceText){
      var srcPrev=document.createElement("div");
      srcPrev.className="rt-preview";
      srcPrev.style.fontSize="12px";
      srcPrev.innerHTML=parseMarkdown(node.leafData.sourceText);
      srcSection.appendChild(srcPrev);
    }
    if(node.leafData.sourceImages&&node.leafData.sourceImages.length>0){
      var srcImgsPrev=document.createElement("div");
      srcImgsPrev.className="source-images";
      node.leafData.sourceImages.forEach(function(imgData){
        var item=document.createElement("div");
        item.className="source-img-item";
        item.style.cursor="zoom-in";
        var img=document.createElement("img");img.src=imgData;
        item.appendChild(img);
        item.addEventListener("click",function(){showLightbox(imgData);});
        srcImgsPrev.appendChild(item);
      });
      srcSection.appendChild(srcImgsPrev);
    }
  }
  contentFieldsEl.appendChild(srcSection);
}

/* ---------- Mindmap Editor ---------- */
function renderMindmapEditor(node){
  if(!node.mindmapData)node.mindmapData=defaultMindmap(node.title);
  if(!node.mindmapData.mmTemplate)node.mindmapData.mmTemplate="radial";

  /* Template selector */
  var templateRow=document.createElement("div");
  templateRow.className="mm-template-row";
  var tplLabel=document.createElement("div");
  tplLabel.className="mm-template-label";tplLabel.textContent="导图形式";
  var tplSelect=document.createElement("select");
  tplSelect.className="mm-template-select";
  var templates=[
    {value:"radial",label:"放射状"},
    {value:"tree",label:"树状图"},
    {value:"fishbone",label:"鱼骨图"},
  ];
  templates.forEach(function(t){
    var o=document.createElement("option");o.value=t.value;o.textContent=t.label;
    if(node.mindmapData.mmTemplate===t.value)o.selected=true;
    tplSelect.appendChild(o);
  });
  tplSelect.addEventListener("change",function(){
    node.mindmapData.mmTemplate=tplSelect.value;
    function clearPos(nd){delete nd._px;delete nd._py;if(nd.children)nd.children.forEach(clearPos);}
    clearPos(node.mindmapData);
    saveState();updateDetailPanel();
  });
  templateRow.appendChild(tplLabel);templateRow.appendChild(tplSelect);
  contentFieldsEl.appendChild(templateRow);

  var importRow=document.createElement("div");
  importRow.className="mm-import-row";
  var importBtn=document.createElement("button");
  importBtn.textContent="导入思维导图";
  importBtn.className="mm-import-btn";
  importBtn.addEventListener("click",function(){
    var input=document.createElement("input");
    input.type="file";
    input.accept=".posf,.pos,.mm,.json,.xml,.xmind,.mmap,.txt,.csv,.html,.htm,image/*";
    input.addEventListener("change",function(){
      var file=input.files[0];if(!file)return;
      if(file.type.startsWith("image/")){
        var imgReader=new FileReader();
        imgReader.onload=function(e){
          node.mindmapData=node.mindmapData||defaultMindmap(node.title);
          node.mindmapData.bgImage=e.target.result;
          saveState();updateDetailPanel();
        };
        imgReader.readAsDataURL(file);
        return;
      }
      var abReader=new FileReader();
      abReader.onload=function(ev){
        var buf=ev.target.result;
        var bytes=new Uint8Array(buf);
        var isZip=bytes.length>3&&bytes[0]===0x50&&bytes[1]===0x4B&&bytes[2]===0x03&&bytes[3]===0x04;
        if(isZip){
          if(typeof JSZip==="undefined"){alert("JSZip未加载，无法处理压缩文件。");return;}
          JSZip.loadAsync(buf).then(function(zip){
            var jsonFile=null;
            var allFiles=[];
            zip.forEach(function(path,f){allFiles.push({path:path,file:f});});
            for(var i=0;i<allFiles.length;i++){
              var p=allFiles[i].path.toLowerCase();
              if(p.endsWith(".json")||p.endsWith(".posf")||p.endsWith("content")||p.endsWith("data")){
                jsonFile=allFiles[i].file;break;
              }
            }
            if(jsonFile){
              jsonFile.async("string").then(function(txt){
                var parsed=parseMindmapFile(txt,file.name);
                if(parsed){node.mindmapData=parsed;saveState();updateDetailPanel();}
                else{alert("ZIP内未找到有效的思维导图数据。");}
              });
            }else{
              Promise.all(allFiles.map(function(f){return f.file.async("string").then(function(c){return{path:f.path,content:c};}).catch(function(){return{path:f.path,content:""};});})).then(function(results){
                for(var j=0;j<results.length;j++){
                  var parsed=parseMindmapFile(results[j].content,file.name);
                  if(parsed){node.mindmapData=parsed;saveState();updateDetailPanel();return;}
                }
                alert("ZIP内未找到思维导图文件。");
              });
            }
          }).catch(function(){alert("无法解压此文件。");});
        }else{
          var decoder=new TextDecoder("utf-8");
          var content=decoder.decode(buf);
          var parsed=parseMindmapFile(content,file.name);
          if(parsed){node.mindmapData=parsed;saveState();updateDetailPanel();}
          else{alert("无法解析此文件格式。支持：ProcessOn(.posf)、FreeMind(.mm)、JSON、XMind、CSV/TSV、HTML大纲。");}
        }
      };
      abReader.readAsArrayBuffer(file);
    });
    input.click();
  });
  importRow.appendChild(importBtn);
  var resetBtn=document.createElement("button");
  resetBtn.textContent="重置布局";
  resetBtn.className="mm-import-btn";
  resetBtn.style.marginLeft="8px";
  resetBtn.addEventListener("click",function(){
    function clearPos(nd){
      delete nd._px;delete nd._py;
      if(nd.children)nd.children.forEach(clearPos);
    }
    clearPos(node.mindmapData);
    mmView={x:0,y:0,scale:1};
    saveState();drawMindmap();
  });
  importRow.appendChild(resetBtn);
  contentFieldsEl.appendChild(importRow);

  var container=document.createElement("div");
  container.className="mindmap-editor";
  var mmSvg=document.createElementNS(SVG_NS,"svg");
  mmSvg.setAttribute("width","100%");mmSvg.setAttribute("height","100%");
  container.appendChild(mmSvg);
  contentFieldsEl.appendChild(container);

  var mmView={x:0,y:0,scale:1};
  function drawMindmap(){
    while(mmSvg.firstChild)mmSvg.removeChild(mmSvg.firstChild);
    var rect=container.getBoundingClientRect();
    var w=rect.width,h=rect.height;
    mmSvg.setAttribute("viewBox","0 0 "+w+" "+h);

    if(!node.mindmapData)node.mindmapData=defaultMindmap(node.title);

    var defs=document.createElementNS(SVG_NS,"defs");
    defs.innerHTML='<filter id="glow-soft"><feGaussianBlur stdDeviation="3"/></filter>';
    if(node.mindmapData.bgImage){
      var imgPattern=document.createElementNS(SVG_NS,"image");
      imgPattern.setAttributeNS("http://www.w3.org/1999/xlink","href",node.mindmapData.bgImage);
      imgPattern.setAttribute("x","0");imgPattern.setAttribute("y","0");
      imgPattern.setAttribute("width",w);imgPattern.setAttribute("height",h);
      imgPattern.setAttribute("opacity","0.35");
      imgPattern.setAttribute("preserveAspectRatio","xMidYMid meet");
      defs.appendChild(imgPattern);
      var bgImg=imgPattern.cloneNode(true);
      bgImg.setAttribute("opacity","0.35");
      mmSvg.appendChild(bgImg);
    }
    mmSvg.appendChild(defs);

    var vg=document.createElementNS(SVG_NS,"g");
    vg.setAttribute("id","mm-viewport");
    vg.setAttribute("transform","translate("+mmView.x+","+mmView.y+") scale("+mmView.scale+")");
    mmSvg.appendChild(vg);

    /* Compute layout - use stored positions or auto-layout */
    var positions={};
    var levelHeight=45;
    var mmCenter={x:w/2,y:h/2};

    function layoutRadial(nodeData,angle,spread,dist,level){
      if(nodeData._px!==undefined&&nodeData._py!==undefined){
        positions[nodeData.id]={x:nodeData._px,y:nodeData._py,level:level,text:nodeData.text};
      }else{
        var x=mmCenter.x+Math.cos(angle)*dist;
        var y=mmCenter.y+Math.sin(angle)*dist;
        positions[nodeData.id]={x:x,y:y,level:level,text:nodeData.text};
      }
      var children=nodeData.children||[];
      if(children.length===0)return;
      var childDist=dist+levelHeight;
      var childSpread=children.length===1?0:Math.min(spread,Math.PI*0.7);
      var startAngle=angle-childSpread/2;
      var step=children.length===1?0:childSpread/(children.length-1);
      for(var i=0;i<children.length;i++){
        var childAngle=startAngle+step*i;
        layoutRadial(children[i],childAngle,spread*0.55,childDist,level+1);
      }
    }

    function countLeaves(nodeData){
      var children=nodeData.children||[];
      if(children.length===0)return 1;
      var c=0;
      for(var i=0;i<children.length;i++)c+=countLeaves(children[i]);
      return c;
    }

    function layoutTree(nodeData,x,y,level){
      if(nodeData._px!==undefined&&nodeData._py!==undefined){
        positions[nodeData.id]={x:nodeData._px,y:nodeData._py,level:level,text:nodeData.text};
      }else{
        positions[nodeData.id]={x:x,y:y,level:level,text:nodeData.text};
      }
      var children=nodeData.children||[];
      if(children.length===0)return 1;
      var totalLeaves=0;
      var childY=y;
      for(var i=0;i<children.length;i++){
        var leaves=countLeaves(children[i]);
        var childX=x+120;
        var midY=childY+(leaves-1)*22;
        layoutTree(children[i],childX,midY,level+1);
        childY+=leaves*44;
        totalLeaves+=leaves;
      }
      return Math.max(totalLeaves,1);
    }

    function layoutFishbone(nodeData){
      var children=nodeData.children||[];
      if(nodeData._px!==undefined&&nodeData._py!==undefined){
        positions[nodeData.id]={x:nodeData._px,y:nodeData._py,level:0,text:nodeData.text};
      }else{
        positions[nodeData.id]={x:w/2,y:h/2,level:0,text:nodeData.text};
      }
      var spacing=Math.min((w-120)/Math.max(children.length,1),100);
      for(var i=0;i<children.length;i++){
        var side=i%2===0?-1:1;
        var bx=w/2+(i+1-children.length/2)*spacing;
        var by=h/2;
        layoutFishboneBranch(children[i],bx,by,side,1);
      }
    }
    function layoutFishboneBranch(nodeData,bx,by,side,level){
      var offsetY=side*50*level;
      var px=bx+level*30;
      var py=by+offsetY;
      if(nodeData._px!==undefined&&nodeData._py!==undefined){
        positions[nodeData.id]={x:nodeData._px,y:nodeData._py,level:level,text:nodeData.text};
      }else{
        positions[nodeData.id]={x:px,y:py,level:level,text:nodeData.text};
      }
      var children=nodeData.children||[];
      for(var i=0;i<children.length;i++){
        layoutFishboneBranch(children[i],bx+(i+1)*20,py,side,level+1);
      }
    }

    var mmTemplate=node.mindmapData.mmTemplate||"radial";
    if(mmTemplate==="tree"){
      var treeLeaves=layoutTree(node.mindmapData,40,h/2,0);
    }else if(mmTemplate==="fishbone"){
      layoutFishbone(node.mindmapData);
    }else{
      layoutRadial(node.mindmapData,0,Math.PI*1.7,0,0);
    }

    /* Draw lines first */
    function drawLines(nodeData){
      var pos=positions[nodeData.id];
      var children=nodeData.children||[];
      for(var i=0;i<children.length;i++){
        var cpos=positions[children[i].id];
        if(!cpos)continue;
        var line=document.createElementNS(SVG_NS,"path");
        var mx=(pos.x+cpos.x)/2;
        var my=(pos.y+cpos.y)/2;
        var dx=cpos.x-pos.x,dy=cpos.y-pos.y;
        var len=Math.sqrt(dx*dx+dy*dy)||1;
        var px=-dy/len,py=dx/len;
        var d="M"+pos.x+","+pos.y+"Q"+(mx+px*8)+","+(my+py*8)+" "+cpos.x+","+cpos.y;
        line.setAttribute("d",d);
        line.setAttribute("fill","none");
        var colors=["#4dd0e1","#80deea","#b2ebf2","#d4f1f4"];
        line.setAttribute("stroke",colors[Math.min(children[i]._level||1,3)]);
        line.setAttribute("stroke-width","1");
        line.setAttribute("opacity","0.3");
        vg.appendChild(line);
        drawLines(children[i]);
      }
    }
    /* Mark levels */
    function markLevels(nodeData,level){
      nodeData._level=level;
      var children=nodeData.children||[];
      for(var i=0;i<children.length;i++)markLevels(children[i],level+1);
    }
    markLevels(node.mindmapData,0);
    drawLines(node.mindmapData);

    /* Draw nodes */
    function drawNodes(nodeData){
      var pos=positions[nodeData.id];
      if(!pos)return;
      var level=nodeData._level||0;
      var colors=["#e8d5a0","#4dd0e1","#80deea","#b2ebf2"];
      var color=colors[Math.min(level,3)];
      var radii=[22,16,13,11];
      var r=radii[Math.min(level,3)];

      var g=document.createElementNS(SVG_NS,"g");
      g.setAttribute("transform","translate("+pos.x+","+pos.y+")");
      g.setAttribute("class","mm-node");
      g.setAttribute("data-mmid",nodeData.id);
      g.style.cursor="move";

      var glow=document.createElementNS(SVG_NS,"circle");
      glow.setAttribute("r",r*1.8);glow.setAttribute("fill",color);
      glow.setAttribute("opacity","0.1");glow.setAttribute("filter","url(#glow-soft)");
      g.appendChild(glow);

      var circle=document.createElementNS(SVG_NS,"circle");
      circle.setAttribute("r",r);circle.setAttribute("fill","rgba(12,20,38,0.8)");
      circle.setAttribute("stroke",color);circle.setAttribute("stroke-width","1");
      circle.setAttribute("opacity","0.9");
      g.appendChild(circle);

      var text=document.createElementNS(SVG_NS,"text");
      text.setAttribute("text-anchor","middle");text.setAttribute("dominant-baseline","central");
      text.setAttribute("fill",color);text.setAttribute("font-size",level===0?"11":"9");
      text.setAttribute("font-family","sans-serif");text.setAttribute("font-weight","500");
      var txt=nodeData.text||"";
      var maxChars=level===0?6:level===1?4:3;
      if(txt.length>maxChars)txt=txt.slice(0,maxChars)+"…";
      text.textContent=txt;
      g.appendChild(text);

      g.addEventListener("dblclick",function(e){
        e.stopPropagation();
        var newText=prompt("编辑节点文字:",nodeData.text||"");
        if(newText!==null){nodeData.text=newText.trim();saveState();drawMindmap();}
      });
      g.addEventListener("contextmenu",function(e){
        e.preventDefault();e.stopPropagation();
        showMindmapCtxMenu(e.clientX,e.clientY,nodeData,node,drawMindmap);
      });
      g.addEventListener("mousedown",function(e){
        if(e.button!==0)return;
        e.stopPropagation();
        var startX=e.clientX,startY=e.clientY;
        var origX=pos.x,origY=pos.y;
        var moved=false;
        function onMove(ev){
          var dx=(ev.clientX-startX)/mmView.scale;
          var dy=(ev.clientY-startY)/mmView.scale;
          if(Math.abs(dx)>2||Math.abs(dy)>2)moved=true;
          pos.x=origX+dx;pos.y=origY+dy;
          g.setAttribute("transform","translate("+pos.x+","+pos.y+")");
          redrawLines();
        }
        function onUp(ev){
          document.removeEventListener("mousemove",onMove);
          document.removeEventListener("mouseup",onUp);
          if(moved){
            nodeData._px=pos.x;nodeData._py=pos.y;
            saveState();
          }
        }
        document.addEventListener("mousemove",onMove);
        document.addEventListener("mouseup",onUp);
      });
      g.addEventListener("touchstart",function(e){
        if(e.touches.length!==1)return;
        e.stopPropagation();e.preventDefault();
        var t=e.touches[0];
        var startX=t.clientX,startY=t.clientY;
        var origX=pos.x,origY=pos.y;
        var moved=false;
        function onMove(ev){
          var t2=ev.touches[0];if(!t2)return;
          var dx=(t2.clientX-startX)/mmView.scale;
          var dy=(t2.clientY-startY)/mmView.scale;
          if(Math.abs(dx)>2||Math.abs(dy)>2)moved=true;
          pos.x=origX+dx;pos.y=origY+dy;
          g.setAttribute("transform","translate("+pos.x+","+pos.y+")");
          redrawLines();
          ev.preventDefault();
        }
        function onUp(ev){
          document.removeEventListener("touchmove",onMove);
          document.removeEventListener("touchend",onUp);
          if(moved){nodeData._px=pos.x;nodeData._py=pos.y;saveState();}
        }
        document.addEventListener("touchmove",onMove,{passive:false});
        document.addEventListener("touchend",onUp,{passive:false});
      },{passive:false});
      g.addEventListener("click",function(e){e.stopPropagation();});

      vg.appendChild(g);
      var children=nodeData.children||[];
      for(var i=0;i<children.length;i++)drawNodes(children[i]);
    }

    function redrawLines(){
      var lines=vg.querySelectorAll("path");
      for(var li=0;li<lines.length;li++)vg.removeChild(lines[li]);
      var lineGroup=document.createElementNS(SVG_NS,"g");
      vg.insertBefore(lineGroup,vg.firstChild);
      function drawL(nodeData){
        var pos2=positions[nodeData.id];
        var ch=nodeData.children||[];
        for(var j=0;j<ch.length;j++){
          var cpos2=positions[ch[j].id];if(!cpos2)continue;
          var ln=document.createElementNS(SVG_NS,"path");
          var mx2=(pos2.x+cpos2.x)/2;
          var my2=(pos2.y+cpos2.y)/2;
          var dx2=cpos2.x-pos2.x,dy2=cpos2.y-pos2.y;
          var len2=Math.sqrt(dx2*dx2+dy2*dy2)||1;
          var px2=-dy2/len2,py2=dx2/len2;
          ln.setAttribute("d","M"+pos2.x+","+pos2.y+"Q"+(mx2+px2*8)+","+(my2+py2*8)+" "+cpos2.x+","+cpos2.y);
          ln.setAttribute("fill","none");
          var lc=["#4dd0e1","#80deea","#b2ebf2","#d4f1f4"];
          ln.setAttribute("stroke",lc[Math.min(ch[j]._level||1,3)]);
          ln.setAttribute("stroke-width","1");ln.setAttribute("opacity","0.3");
          lineGroup.appendChild(ln);
          drawL(ch[j]);
        }
      }
      drawL(node.mindmapData);
    }
    drawNodes(node.mindmapData);

    /* Pan on background drag */
    mmSvg.addEventListener("mousedown",function(e){
      if(e.target===mmSvg||e.target.tagName==="image"){
        var sx=e.clientX,sy=e.clientY;
        var ovx=mmView.x,ovy=mmView.y;
        function mv(ev){
          mmView.x=ovx+(ev.clientX-sx);
          mmView.y=ovy+(ev.clientY-sy);
          vg.setAttribute("transform","translate("+mmView.x+","+mmView.y+") scale("+mmView.scale+")");
        }
        function up(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);}
        document.addEventListener("mousemove",mv);
        document.addEventListener("mouseup",up);
        e.preventDefault();
      }
    });
    mmSvg.addEventListener("wheel",function(e){
      e.preventDefault();
      var delta=e.deltaY>0?0.9:1.1;
      mmView.scale=Math.max(0.3,Math.min(3,mmView.scale*delta));
      vg.setAttribute("transform","translate("+mmView.x+","+mmView.y+") scale("+mmView.scale+")");
    },{passive:false});
    /* Touch: pinch zoom & pan */
    var touchState=null;
    mmSvg.addEventListener("touchstart",function(e){
      if(e.touches.length===1){
        if(e.target.tagName==="image"||e.target===mmSvg){
          touchState={type:"pan",sx:e.touches[0].clientX,sy:e.touches[0].clientY,ovx:mmView.x,ovy:mmView.y};
        }
      }else if(e.touches.length===2){
        var dx=e.touches[0].clientX-e.touches[1].clientX;
        var dy=e.touches[0].clientY-e.touches[1].clientY;
        touchState={type:"zoom",startDist:Math.sqrt(dx*dx+dy*dy),startScale:mmView.scale};
      }
      e.preventDefault();
    },{passive:false});
    mmSvg.addEventListener("touchmove",function(e){
      if(!touchState)return;
      if(touchState.type==="pan"&&e.touches.length===1){
        mmView.x=touchState.ovx+(e.touches[0].clientX-touchState.sx);
        mmView.y=touchState.ovy+(e.touches[0].clientY-touchState.sy);
        vg.setAttribute("transform","translate("+mmView.x+","+mmView.y+") scale("+mmView.scale+")");
      }else if(touchState.type==="zoom"&&e.touches.length===2){
        var dx2=e.touches[0].clientX-e.touches[1].clientX;
        var dy2=e.touches[0].clientY-e.touches[1].clientY;
        var dist=Math.sqrt(dx2*dx2+dy2*dy2);
        mmView.scale=Math.max(0.3,Math.min(3,touchState.startScale*(dist/touchState.startDist)));
        vg.setAttribute("transform","translate("+mmView.x+","+mmView.y+") scale("+mmView.scale+")");
      }
      e.preventDefault();
    },{passive:false});
    mmSvg.addEventListener("touchend",function(e){if(e.touches.length===0)touchState=null;},{passive:false});
  }

  setTimeout(drawMindmap,50);
  var ro=new ResizeObserver(function(){drawMindmap();});
  ro.observe(container);
}

function showMindmapCtxMenu(x,y,mmNode,leafNode,redraw){
  ctxMenu.innerHTML="";
  var addChild=document.createElement("button");
  addChild.textContent="添加子节点";
  addChild.addEventListener("click",function(){
    if(!mmNode.children)mmNode.children=[];
    var newNode={id:genId(),text:"新节点",children:[]};
    mmNode.children.push(newNode);
    saveState();redraw();
    ctxMenu.style.display="none";
  });
  ctxMenu.appendChild(addChild);

  if(mmNode!==leafNode.mindmapData){
    var addSib=document.createElement("button");
    addSib.textContent="添加兄弟节点";
    addSib.addEventListener("click",function(){
      var parent=findMindmapParent(leafNode.mindmapData,mmNode.id);
      if(parent){
        if(!parent.children)parent.children=[];
        parent.children.push({id:genId(),text:"新节点",children:[]});
        saveState();redraw();
      }
      ctxMenu.style.display="none";
    });
    ctxMenu.appendChild(addSib);

    ctxMenu.appendChild(document.createElement("hr"));

    var delBtn=document.createElement("button");
    delBtn.textContent="删除节点";delBtn.className="danger";
    delBtn.addEventListener("click",function(){
      var parent=findMindmapParent(leafNode.mindmapData,mmNode.id);
      if(parent&&parent.children){
        parent.children=parent.children.filter(function(c){return c.id!==mmNode.id;});
        saveState();redraw();
      }
      ctxMenu.style.display="none";
    });
    ctxMenu.appendChild(delBtn);
  }

  ctxMenu.style.left=x+"px";ctxMenu.style.top=y+"px";
  ctxMenu.style.display="block";
}
function findMindmapParent(root,targetId){
  if(!root.children)return null;
  for(var i=0;i<root.children.length;i++){
    if(root.children[i].id===targetId)return root;
    var found=findMindmapParent(root.children[i],targetId);
    if(found)return found;
  }
  return null;
}

/* ---------- Mindmap Import Parser ---------- */
function parseMindmapFile(content,fileName){
  var ext=(fileName.split(".").pop()||"").toLowerCase();
  content=content.trim();
  if(ext==="json"||ext==="posf"||ext==="pos"){
    try{
      var data=JSON.parse(content);
      return parseJSONMindmap(data);
    }catch(e){
      if(content.charAt(0)==="<")return parseXMLMindmap(content);
      return parseOutlineText(content);
    }
  }
  if(ext==="mm"||ext==="xml"||ext==="mmap"){
    return parseXMLMindmap(content);
  }
  if(ext==="csv"||ext==="tsv"||ext==="txt"){
    if(content.charAt(0)==="<")return parseXMLMindmap(content);
    return parseOutlineText(content);
  }
  if(ext==="html"||ext==="htm"){
    return parseHTMLMindmap(content);
  }
  if(content.charAt(0)==="{")return parseJSONMindmap(JSON.parse(content));
  if(content.charAt(0)==="<")return parseXMLMindmap(content);
  return parseOutlineText(content);
}
function parseJSONMindmap(data){
  if(!data)return null;
  if(data.id&&data.text!==undefined){
    return normalizeMMNode(data);
  }
  if(data.title){
    return{id:genId(),text:data.title,children:[]};
  }
  if(data.elements||data.diagram||data.shapes||data.diagramElements){
    return parseProcessOnData(data);
  }
  if(data.root){
    return normalizeMMNode(data.root);
  }
  if(data.mindmap){
    return normalizeMMNode(data.mindmap);
  }
  if(Array.isArray(data)){
    var root={id:genId(),text:data[0]?.title||data[0]?.text||"根节点",children:[]};
    for(var i=1;i<data.length;i++){
      if(data[i].title||data[i].text){
        root.children.push(normalizeMMNode({text:data[i].title||data[i].text,children:data[i].children}));
      }
    }
    return root;
  }
  return null;
}
function normalizeMMNode(node){
  if(!node)return null;
  var text=node.text||node.title||node.name||node.topic||"节点";
  var children=[];
  var childSource=node.children||node.nodes||node.branches||node.subTopics;
  if(childSource&&Array.isArray(childSource)){
    for(var i=0;i<childSource.length;i++){
      var cn=normalizeMMNode(childSource[i]);
      if(cn)children.push(cn);
    }
  }
  return{id:node.id||genId(),text:text,children:children};
}
function parseProcessOnData(data){
  var elements=data.elements||data.diagramElements||data.shapes||data.diagram||{};
  if(data.diagram&&data.diagram.elements)elements=data.diagram.elements;
  if(typeof elements==="string")elements=JSON.parse(elements);
  var elementArr=[];
  if(Array.isArray(elements))elementArr=elements;
  else{for(var ek in elements){if(typeof elements[ek]==="object")elementArr.push(Object.assign({id:ek},elements[ek]));}}
  var findRoot=null;
  for(var i=0;i<elementArr.length;i++){
    var el=elementArr[i];
    var t=(el.type||"").toLowerCase();
    var s=(el.shape||"").toLowerCase();
    if(t==="mindmap"&&(s==="root"||s==="central")||el.isRoot||el.root===true){
      findRoot=el;break;
    }
  }
  if(!findRoot){
    var noParent=elementArr.filter(function(e){return!e.parentId&&!e.pid;});
    if(noParent.length>0)findRoot=noParent[0];
  }
  if(!findRoot){
    for(var j=0;j<elementArr.length;j++){
      var el2=elementArr[j];
      var t2=(el2.type||"").toLowerCase();
      if(t2==="text"||t2==="mindmap"||t2==="node"||t2==="topic"){findRoot=el2;break;}
    }
  }
  if(!findRoot&&elementArr.length>0)findRoot=elementArr[0];
  if(!findRoot)return null;
  var elemMap={};
  elementArr.forEach(function(e){if(e.id)elemMap[e.id]=e;});
  var root={id:genId(),text:findRoot.text||findRoot.title||findRoot.content||"中心",children:[]};
  function collectChildren(parentId){
    var kids=[];
    for(var ci=0;ci<elementArr.length;ci++){
      var ce=elementArr[ci];
      if(ce===findRoot)continue;
      var ceParent=ce.parentId||ce.pid||ce.parent;
      if(ceParent===parentId||ceParent===findRoot.id){
        kids.push({id:genId(),text:ce.text||ce.title||ce.content||"子节点",children:collectChildren(ce.id||ci)});
      }
    }
    return kids;
  }
  root.children=collectChildren(findRoot.id||elementArr[0].id);
  return root;
}
function parseXMLMindmap(xml){
  var parser=new DOMParser();
  var doc=parser.parseFromString(xml,"text/xml");
  var rootEl=doc.querySelector("map > node")||doc.querySelector("node")||doc.querySelector("topic");
  if(!rootEl){
    var rootTopic=doc.querySelector("root, Root, Topic");
    if(rootTopic)rootEl=rootTopic;
  }
  if(!rootEl)return null;
  function buildNode(el){
    var text=el.getAttribute("TEXT")||el.getAttribute("text")||el.getAttribute("title")||el.textContent.trim().split("\n")[0]||"节点";
    var children=[];
    var childEls=el.querySelectorAll(":scope > node, :scope > children > node, :scope > topic, :scope > children > topic");
    if(childEls.length===0)childEls=el.children;
    for(var i=0;i<childEls.length;i++){
      if(childEls[i].tagName.toLowerCase()==="node"||childEls[i].tagName.toLowerCase()==="topic"){
        children.push(buildNode(childEls[i]));
      }
    }
    return{id:genId(),text:text,children:children};
  }
  return buildNode(rootEl);
}
function parseOutlineText(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length===0)return null;
  function getIndent(line){
    var m=line.match(/^(\s*)/);
    return m?m[1].length:0;
  }
  function buildTree(startIdx,parentIndent){
    var node={id:genId(),text:lines[startIdx].trim(),children:[]};
    var i=startIdx+1;
    while(i<lines.length){
      var ind=getIndent(lines[i]);
      if(ind<=parentIndent)break;
      var child=buildTree(i,ind);
      node.children.push(child);
      i++;
      while(i<lines.length&&getIndent(lines[i])>ind)i++;
    }
    return node;
  }
  return buildTree(0,getIndent(lines[0]));
}
function parseHTMLMindmap(html){
  var parser=new DOMParser();
  var doc=parser.parseFromString(html,"text/html");
  function buildFromList(el){
    var text=el.previousSibling?el.previousSibling.textContent.trim():"";
    if(!text)text=el.previousElementSibling?el.previousElementSibling.textContent.trim():"根节点";
    var children=[];
    var lis=el.querySelectorAll(":scope > li");
    for(var i=0;i<lis.length;i++){
      var li=lis[i];
      var liText=li.childNodes[0]?li.childNodes[0].textContent.trim():"节点";
      var subUl=li.querySelector("ul,ol");
      if(subUl){
        var subNode=buildFromList(subUl);
        subNode.text=liText;
        children.push(subNode);
      }else{
        children.push({id:genId(),text:liText,children:[]});
      }
    }
    return{id:genId(),text:text,children:children};
  }
  var rootUl=doc.querySelector("ul,ol");
  if(rootUl)return buildFromList(rootUl);
  return null;
}

/* ---------- CSV/Table Import Parser ---------- */
function parseCSVFile(content,fileName){
  var ext=(fileName.split(".").pop()||"").toLowerCase();
  if(ext==="json"){
    try{
      var data=JSON.parse(content);
      if(data.columns&&data.rows)return data;
      if(Array.isArray(data)&&data.length>0){
        var cols=Object.keys(data[0]);
        var rows=data.map(function(r){return cols.map(function(c){return String(r[c]||"");});});
        return{columns:cols,rows:rows};
      }
      return null;
    }catch(e){return null;}
  }
  var separator=",";
  if(ext==="tsv")separator="\t";
  else if(content.indexOf("\t")!==-1&&content.indexOf(",")===-1)separator="\t";
  var lines=content.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<1)return null;
  function parseLine(line,sep){
    var result=[],current="",inQuote=false;
    for(var i=0;i<line.length;i++){
      var ch=line[i];
      if(ch==='"'){if(inQuote&&line[i+1]==='"'){current+='"';i++;}else{inQuote=!inQuote;}}
      else if(ch===sep&&!inQuote){result.push(current);current="";}
      else{current+=ch;}
    }
    result.push(current);
    return result;
  }
  var columns=parseLine(lines[0],separator);
  var rows=[];
  for(var i=1;i<lines.length;i++){
    rows.push(parseLine(lines[i],separator));
  }
  if(columns.length<1)return null;
  while(rows.length<1)rows.push(columns.map(function(){return"";}));
  return{columns:columns,rows:rows};
}

/* ---------- DOCX Table Parser ---------- */
function parseDocxTables(xml){
  var parser=new DOMParser();
  var doc=parser.parseFromString(xml,"text/xml");
  var tables=doc.getElementsByTagName("w:tbl");
  if(tables.length===0){
    var altTables=doc.getElementsByTagName("tbl");
    if(altTables.length>0)tables=altTables;
  }
  if(tables.length===0)return null;
  var tbl=tables[0];
  var rows=tbl.getElementsByTagName("w:tr");
  if(rows.length===0)rows=tbl.getElementsByTagName("tr");
  if(rows.length===0)return null;
  var parsedRows=[];
  for(var i=0;i<rows.length;i++){
    var cells=rows[i].getElementsByTagName("w:tc");
    if(cells.length===0)cells=rows[i].getElementsByTagName("tc");
    var rowData=[];
    for(var j=0;j<cells.length;j++){
      var texts=cells[j].getElementsByTagName("w:t");
      if(texts.length===0)texts=cells[j].getElementsByTagName("t");
      var cellText="";
      for(var k=0;k<texts.length;k++){
        cellText+=(texts[k].textContent||"")+(k<texts.length-1?"":"");
      }
      rowData.push(cellText.trim());
    }
    if(rowData.length>0)parsedRows.push(rowData);
  }
  if(parsedRows.length===0)return null;
  var maxCols=parsedRows[0].length;
  for(var r=0;r<parsedRows.length;r++){
    if(parsedRows[r].length>maxCols)maxCols=parsedRows[r].length;
  }
  var columns=parsedRows[0].slice(0,maxCols);
  while(columns.length<maxCols)columns.push("列"+(columns.length+1));
  var dataRows=parsedRows.slice(1);
  if(dataRows.length===0)dataRows=[columns.map(function(){return"";})];
  for(var d=0;d<dataRows.length;d++){
    while(dataRows[d].length<maxCols)dataRows[d].push("");
  }
  if(tables.length>1){
    alert("DOCX中有 "+tables.length+" 个表格，已导入第一个。");
  }
  return{columns:columns,rows:dataRows};
}

/* ---------- Content Field Paste Handler ---------- */
function handleContentPaste(ev,editableEl,node,field){
  var items=ev.clipboardData&&ev.clipboardData.items;
  if(!items)return;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf("image")!==-1){
      ev.preventDefault();
      var blob=items[i].getAsFile();
      if(!blob)return;
      compressImage(blob,function(dataUrl){
        var img=document.createElement("img");
        img.src=dataUrl;
        img.addEventListener("click",function(){showLightbox(dataUrl);});
        /* Insert at cursor position */
        var sel=window.getSelection();
        if(sel.rangeCount>0&&editableEl.contains(sel.anchorNode)){
          var range=sel.getRangeAt(0);
          range.deleteContents();
          range.insertNode(img);
          range.setStartAfter(img);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        }else{
          editableEl.appendChild(img);
        }
        var br=document.createElement("br");
        editableEl.appendChild(br);
        node.leafData[field.key]=editableEl.innerHTML;
        saveState();
      });
      return;
    }
  }
}

function createNode(type,parentId,x,y,title){
  var trunk=getTrunk();
  if(!parentId&&type==="branch"&&trunk)parentId=trunk.id;
  var node={id:genId(),title:title||"新节点",type:type,parentId:parentId,
    x:x||(trunk?trunk.x+60:canvasArea.clientWidth/2),y:y||(trunk?trunk.y+60:canvasArea.clientHeight/2),
    vx:0,vy:0,fx:0,fy:0,associations:[],collapsed:false};
  if(type==="leaf"){
    node.contentType="rich-text";
    node.leafData=createLeafRichData();
    node.mindmapData=defaultMindmap(title||"新叶子");
    node.tableData=defaultTableData();
    node.galleryData=[];
  }else{node.content="";}
  state.nodes.push(node);simAlpha=1;saveState();return node;
}
function deleteNode(id){
  var toDelete={};
  (function collect(nid){toDelete[nid]=true;getChildren(nid).forEach(function(c){collect(c.id);});})(id);
  var deletedIds=Object.keys(toDelete);
  state.nodes=state.nodes.filter(function(n){return!toDelete[n.id];});
  for(var i=0;i<state.nodes.length;i++){
    var n=state.nodes[i];
    if(n.associations){
      n.associations=n.associations.filter(function(a){return deletedIds.indexOf(a.targetId)===-1;});
    }
  }
  if(state.selectedId&&toDelete[state.selectedId])state.selectedId=null;
  state.assocVersion++;simAlpha=1;saveState();updateDetailPanel();
}
function selectNode(id){state.selectedId=id;previewMode=false;updateDetailPanel();}

/* ---------- Drag Transfer ---------- */
function transferBranch(branchId,newParentId){
  var branch=getNode(branchId);
  var newParent=getNode(newParentId);
  if(!branch||!newParent||branch.type!=="branch")return false;
  if(newParent.type!=="branch"&&newParent.type!=="trunk")return false;
  /* Check for circular */
  var cur=newParent;
  while(cur&&cur.parentId){
    if(cur.parentId===branchId)return false;
    cur=getNode(cur.parentId);
  }
  branch.parentId=newParentId;
  simAlpha=1;saveState();
  return true;
}
function transferLeaf(leafId,newParentId){
  var leaf=getNode(leafId);
  var newParent=getNode(newParentId);
  if(!leaf||!newParent||leaf.type!=="leaf")return false;
  if(newParent.type!=="branch"&&newParent.type!=="trunk")return false;
  leaf.parentId=newParentId;
  spawnParticles(leaf.x,leaf.y);
  simAlpha=1;saveState();
  return true;
}
/* Particle effect system */
var particles=[];
function spawnParticles(x,y){
  for(var i=0;i<20;i++){
    var angle=Math.random()*Math.PI*2;
    var speed=1+Math.random()*3;
    particles.push({
      x:x,y:y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-1,
      life:1,
      size:2+Math.random()*3,
      color:["#a5d6a7","#c8e6c9","#b2dfdb","#80deea"][Math.floor(Math.random()*4)]
    });
  }
}
function renderParticles(){
  if(particles.length===0)return;
  var particleGroup=svg.querySelector("#particle-group");
  if(!particleGroup){
    particleGroup=document.createElementNS(SVG_NS,"g");
    particleGroup.setAttribute("id","particle-group");
    particleGroup.setAttribute("pointer-events","none");
    nodesGroup.appendChild(particleGroup);
  }
  while(particleGroup.firstChild)particleGroup.removeChild(particleGroup.firstChild);
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=0.05;
    p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue;}
    var c=document.createElementNS(SVG_NS,"circle");
    c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);
    c.setAttribute("r",p.size*p.life);
    c.setAttribute("fill",p.color);
    c.setAttribute("opacity",p.life*0.8);
    c.setAttribute("filter","url(#glow-soft)");
    particleGroup.appendChild(c);
  }
  if(particles.length===0){
    var pg=svg.querySelector("#particle-group");
    if(pg)pg.parentNode.removeChild(pg);
  }
}

/* ---------- Event Handlers ---------- */
function handlePointerDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  var pos=getMousePos(e);
  var g=findNodeGroup(e.target);
  if(g){
    var id=g.getAttribute("data-id");
    var node=getNode(id);if(!node)return;
    var world=screenToWorld(pos.x,pos.y);
    drag={id:id,type:node.type,offsetWX:world.x-node.x,offsetWY:world.y-node.y,moved:false,downX:pos.x,downY:pos.y};
    dragTransferTarget=null;
  }else{
    pan={startClientX:pos.clientX,startClientY:pos.clientY,startVpX:viewport.x,startVpY:viewport.y,moved:false};
    svg.classList.add("panning");
  }
}
function handlePointerMove(e){
  var pos=getMousePos(e);
  if(drag){
    var dx=pos.x-drag.downX,dy=pos.y-drag.downY;
    if(Math.abs(dx)>4||Math.abs(dy)>4){drag.moved=true;svg.classList.add("node-drag");}
    if(drag.moved){
      var node=getNode(drag.id);if(node){
        var world=screenToWorld(pos.x,pos.y);
        node.x=world.x-drag.offsetWX;node.y=world.y-drag.offsetWY;
        node.vx=0;node.vy=0;simAlpha=Math.max(simAlpha,0.3);

        /* Check drag transfer for branches and leaves */
        if(drag.type==="branch"||drag.type==="leaf"){
          var closest=null,closestDist=Infinity;
          for(var i=0;i<state.nodes.length;i++){
            var on=state.nodes[i];
            if(on.id===drag.id)continue;
            if(on.type!=="branch"&&on.type!=="trunk")continue;
            if(on.id===node.parentId)continue;
            /* Check not a descendant (for branches) */
            if(drag.type==="branch"){
              var isDesc=false,cur=on;
              while(cur&&cur.parentId){
                if(cur.parentId===drag.id){isDesc=true;break;}
                cur=getNode(cur.parentId);
              }
              if(isDesc)continue;
            }
            var ddx=on.x-node.x,ddy=on.y-node.y,dd=Math.sqrt(ddx*ddx+ddy*ddy);
            var ost=getNodeStyle(on);
            if(dd<ost.radius+20&&dd<closestDist){closest=on;closestDist=dd;}
          }
          dragTransferTarget=closest?closest.id:null;
        }
      }
    }
    return;
  }
  if(pan){
    var pdx=pos.clientX-pan.startClientX,pdy=pos.clientY-pan.startClientY;
    if(Math.abs(pdx)>4||Math.abs(pdy)>4)pan.moved=true;
    if(pan.moved){viewport.x=pan.startVpX+pdx;viewport.y=pan.startVpY+pdy;updateViewport();}
    return;
  }
  if(!hoveringAssocLine){
    var g=findNodeGroup(e.target);
    if(g&&e.target.ownerSVGElement===svg){
      var id=g.getAttribute("data-id");
      var node=getNode(id);
      if(node){
        tooltip.style.display="block";
        tooltip.style.left=(pos.clientX+16)+"px";
        tooltip.style.top=(pos.clientY+16)+"px";
        var st=getNodeStyle(node);
        var html='<div class="tt-title" style="color:'+st.text+'">'+escapeHtml(node.title||"未命名")+'</div><div class="tt-type '+node.type+'">'+TYPE_LABELS[node.type]+'</div>';
        if(node.type==="leaf"&&node.contentType){
          html+='<div class="tt-content-type">类型：'+CONTENT_TYPE_LABELS[node.contentType]+'</div>';
        }
        tooltip.innerHTML=html;
        return;
      }
    }
    tooltip.style.display="none";
  }
}
function handlePointerUp(e){
  if(drag){
    if(!drag.moved){
      var id=drag.id;
      if(state.assocMode){
        handleAssocClick(id);
      }else{
        selectNode(id);
      }
    }else if(drag.type==="branch"&&dragTransferTarget){
      transferBranch(drag.id,dragTransferTarget);
    }else if(drag.type==="leaf"&&dragTransferTarget){
      transferLeaf(drag.id,dragTransferTarget);
    }
    svg.classList.remove("node-drag");drag=null;dragTransferTarget=null;
  }
  if(pan){svg.classList.remove("panning");pan=null;}
}

svg.addEventListener("mousedown",handlePointerDown);

/* Touch support */
svg.addEventListener("touchstart",function(e){
  if(e.touches.length===1){
    e.preventDefault();
    var touch=e.touches[0];
    var rect=svg.getBoundingClientRect();
    var fakeEvent={target:document.elementFromPoint(touch.clientX,touch.clientY),clientX:touch.clientX,clientY:touch.clientY,button:0};
    handlePointerDown(fakeEvent);
  }else if(e.touches.length===2){
    e.preventDefault();
    if(drag){svg.classList.remove("node-drag");drag=null;}
    if(pan){svg.classList.remove("panning");pan=null;}
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchData={dist:Math.sqrt(dx*dx+dy*dy),scale:viewport.scale};
  }
},{passive:false});

svg.addEventListener("touchmove",function(e){
  if(e.touches.length===1&&(drag||pan)){
    e.preventDefault();
    var touch=e.touches[0];
    var fakeEvent={target:document.elementFromPoint(touch.clientX,touch.clientY),clientX:touch.clientX,clientY:touch.clientY};
    handlePointerMove(fakeEvent);
  }else if(e.touches.length===2&&pinchData){
    e.preventDefault();
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(pinchData.dist>0){
      var factor=dist/pinchData.dist;
      var newScale=Math.max(0.3,Math.min(3,pinchData.scale*factor));
      var rect=svg.getBoundingClientRect();
      var midX=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;
      var midY=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top;
      var world=screenToWorld(midX,midY);
      viewport.scale=newScale;
      viewport.x=midX-world.x*newScale;
      viewport.y=midY-world.y*newScale;
      updateViewport();
    }
  }
},{passive:false});

svg.addEventListener("touchend",function(e){
  if(e.touches.length===0){
    if(drag&&!drag.moved){
      var id=drag.id;
      if(state.assocMode){handleAssocClick(id);}
      else{selectNode(id);}
    }else if(drag&&drag.type==="branch"&&dragTransferTarget){
      transferBranch(drag.id,dragTransferTarget);
    }else if(drag&&drag.type==="leaf"&&dragTransferTarget){
      transferLeaf(drag.id,dragTransferTarget);
    }
    if(drag){svg.classList.remove("node-drag");drag=null;dragTransferTarget=null;}
    if(pan){svg.classList.remove("panning");pan=null;}
    pinchData=null;
  }
});
