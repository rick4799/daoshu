  var cc=getChildren(id).length;
  var msg="确定删除「"+node.title+"」？";
  if(cc>0)msg+="\n其下 "+cc+" 个子节点也将一并删除。";
  if(confirm(msg))deleteNode(id);
});

svg.addEventListener("dragstart",function(e){e.preventDefault();});

/* Title input */
detailTitle.addEventListener("input",function(){var n=state.selectedId?getNode(state.selectedId):null;if(n){n.title=detailTitle.value;saveState();}});

/* Close button */
detailCloseBtn.addEventListener("click",function(){state.selectedId=null;updateDetailPanel();});

/* Context menu close on outside click */
document.addEventListener("click",function(e){
  if(!ctxMenu.contains(e.target)){ctxMenu.style.display="none";}
  if(!lineMenu.contains(e.target)){lineMenu.style.display="none";}
});
document.addEventListener("contextmenu",function(e){
  if(!ctxMenu.contains(e.target)){ctxMenu.style.display="none";}
});

/* Detail panel buttons */
detailAddBtn.addEventListener("click",function(){
  var n=state.selectedId?getNode(state.selectedId):null;if(!n)return;
  var a=Math.random()*Math.PI*2,d=110;
  var x=n.x+Math.cos(a)*d,y=n.y+Math.sin(a)*d;
  if(n.type==="trunk"){
    var node=createNode("branch",n.id,x,y,"新支干");selectNode(node.id);updateDetailPanel();
  }
});
detailAddSubBtn.addEventListener("click",function(){
  var n=state.selectedId?getNode(state.selectedId):null;if(!n||n.type!=="branch")return;
  var a=Math.random()*Math.PI*2,d=90;
  var x=n.x+Math.cos(a)*d,y=n.y+Math.sin(a)*d;
  var node=createNode("branch",n.id,x,y,"新分支");selectNode(node.id);updateDetailPanel();
});
detailAddLeafBtn.addEventListener("click",function(){
  var n=state.selectedId?getNode(state.selectedId):null;if(!n||n.type!=="branch")return;
  var a=Math.random()*Math.PI*2,d=85;
  var newNode=createNode("leaf",n.id,n.x+Math.cos(a)*d,n.y+Math.sin(a)*d,"新叶子");
  spawnParticles(n.x+Math.cos(a)*d,n.y+Math.sin(a)*d);
  selectNode(newNode.id);updateDetailPanel();
});
detailDeleteBtn.addEventListener("click",function(){
  if(!state.selectedId)return;
  var n=getNode(state.selectedId);if(!n)return;
  if(n.type==="trunk"){
    var trunkCount=state.nodes.filter(function(x){return x.type==="trunk";}).length;
    if(trunkCount<=1){alert("至少保留一个主干节点");return;}
  }
  var cc=getChildren(n.id).length;
  var msg="确定删除「"+n.title+"」？";
  if(cc>0)msg+="\n其下 "+cc+" 个子节点也将一并删除。";
  if(confirm(msg))deleteNode(state.selectedId);
});

/* Toolbar buttons */
btnAddBranch.addEventListener("click",function(){
  var trunk=getTrunk();if(!trunk)return;
  var a=Math.random()*Math.PI*2,d=110;
  var node=createNode("branch",trunk.id,trunk.x+Math.cos(a)*d,trunk.y+Math.sin(a)*d,"新支干");
  selectNode(node.id);updateDetailPanel();
});
btnAddLeaf.addEventListener("click",function(){
  if(btnAddLeaf.disabled)return;
  var n=state.selectedId?getNode(state.selectedId):null;
  if(!n||n.type!=="branch")return;
  var a=Math.random()*Math.PI*2,d=85;
  var newNode=createNode("leaf",n.id,n.x+Math.cos(a)*d,n.y+Math.sin(a)*d,"新叶子");
  spawnParticles(n.x+Math.cos(a)*d,n.y+Math.sin(a)*d);
  selectNode(newNode.id);updateDetailPanel();
});

/* Association mode toggle */
btnAssocMode.addEventListener("click",function(){
  state.assocMode=!state.assocMode;
  state.assocStart=null;
  if(state.assocMode){
    btnAssocMode.classList.add("active");
    assocHint.style.display="block";
  }else{
    btnAssocMode.classList.remove("active");
    assocHint.style.display="none";
  }
});

/* Show all associations toggle */
btnShowAssoc.addEventListener("click",function(){
  state.showAllAssoc=!state.showAllAssoc;
  if(state.showAllAssoc){
    btnShowAssoc.classList.add("filter-active");
  }else{
    btnShowAssoc.classList.remove("filter-active");
  }
  state.assocVersion++;
});

btnResetView.addEventListener("click",function(){
  viewport.x=0;viewport.y=0;viewport.scale=1;updateViewport();simAlpha=1;
  var trunk=getTrunk();
  if(trunk){trunk.x=canvasArea.clientWidth/2;trunk.y=canvasArea.clientHeight/2;trunk.vx=0;trunk.vy=0;}
  state.nodes.forEach(function(n){if(n.type!=="trunk"){n.vx=(Math.random()-0.5)*30;n.vy=(Math.random()-0.5)*30;}});
});

/* Mobile mode toggle */
btnMobileMode.addEventListener("click",function(){
  appEl.classList.toggle("mobile-mode");
  btnMobileMode.classList.toggle("filter-active");
  simAlpha=1;
  setTimeout(function(){simAlpha=1;},100);
});

window.addEventListener("resize",function(){simAlpha=Math.max(simAlpha,0.4);});

/* Association dialog */
document.getElementById("assoc-dialog-ok").addEventListener("click",function(){
  if(pendingAssoc){
    var label=assocLabelInput.value.trim();
    if(label){
      var source=getNode(pendingAssoc.sourceId);
      if(source){
        if(!source.associations)source.associations=[];
        source.associations=source.associations.filter(function(a){return a.targetId!==pendingAssoc.targetId;});
        source.associations.push({targetId:pendingAssoc.targetId,label:label});
        state.assocVersion++;saveState();updateDetailPanel();
      }
    }
  }
  hideAssocDialog();
});
document.getElementById("assoc-dialog-cancel").addEventListener("click",hideAssocDialog);
assocLabelInput.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();document.getElementById("assoc-dialog-ok").click();}});
assocDialog.addEventListener("click",function(e){if(e.target===assocDialog)hideAssocDialog();});

/* Line menu */
document.getElementById("line-menu-edit").addEventListener("click",function(){
  if(pendingLineEdit){
    showAssocDialog(pendingLineEdit.sourceId,pendingLineEdit.targetId,pendingLineEdit.oldLabel);
  }
  lineMenu.style.display="none";
});
document.getElementById("line-menu-delete").addEventListener("click",function(){
  if(pendingLineEdit){
    var source=getNode(pendingLineEdit.sourceId);
    if(source&&source.associations){
      source.associations=source.associations.filter(function(a){return a.targetId!==pendingLineEdit.targetId;});
      state.assocVersion++;saveState();updateDetailPanel();
    }
  }
  lineMenu.style.display="none";
});

window.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(contentViewer.style.display==="flex"){closeContentViewer();return;}
    if(imageLightbox.style.display==="flex"){imageLightbox.style.display="none";return;}
    if(assocDialog.style.display==="flex"){hideAssocDialog();return;}
    if(ctxMenu.style.display==="block"){ctxMenu.style.display="none";return;}
    if(lineMenu.style.display==="block"){lineMenu.style.display="none";return;}
    if(state.assocMode){
      state.assocMode=false;state.assocStart=null;
      btnAssocMode.classList.remove("active");assocHint.style.display="none";
      return;
    }
    if(state.selectedId){state.selectedId=null;updateDetailPanel();}
  }
});

/* ---------- Init ---------- */
function init(){
  loadState();
  loadFruits();
  if(state.nodes.length===0||!getTrunk()){
    var cx=canvasArea.clientWidth/2,cy=canvasArea.clientHeight/2;
    state.nodes=[{id:genId(),title:"道",content:"万物之始，道之本源。",type:"trunk",parentId:null,x:cx,y:cy,vx:0,vy:0,fx:0,fy:0,associations:[]}];
    saveState();
  }else{
    var trunk=getTrunk();
    if(trunk){
      var W=canvasArea.clientWidth,H=canvasArea.clientHeight;
      if(trunk.x<50||trunk.x>W-50)trunk.x=W/2;
      if(trunk.y<50||trunk.y>H-50)trunk.y=H/2;
    }
  }
  updateViewport();updateDetailPanel();
  growthAnim=1;simAlpha=1;
  simulate();
}
init();
initApp();
/* Fruit Library event listeners */
document.getElementById("fruit-btn").addEventListener("click",function(){openFruitLibrary();});
document.getElementById("fruit-overlay-close").addEventListener("click",function(){closeFruitLibrary();});
document.getElementById("fruit-detail-close").addEventListener("click",function(){closeFruitDetail();});
document.getElementById("fruit-detail-modal").addEventListener("click",function(e){
  if(e.target===this)closeFruitDetail();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(document.getElementById("fruit-detail-modal").classList.contains("show")){closeFruitDetail();}
    else if(document.getElementById("fruit-overlay").classList.contains("show")){closeFruitLibrary();}
  }
});
</script>
</body>
</html>
